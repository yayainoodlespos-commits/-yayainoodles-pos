<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS ก๋วยเตี๋ยวหมูต้มยำ</title>

    <!-- PWA: หน้านี้คือหน้าเว็บระดับบนสุดจริงๆ (ไม่ใช่ Apps Script ที่ถูก iframe sandbox)
         Chrome/Safari เลยมองเห็น manifest กับไอคอนได้ตามปกติ -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#386641">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ก๋วยเตี๋ยวหมูต้มยำ">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #F7F8F4;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!--
      ตัวแอป POS จริงทั้งหมดยังทำงานอยู่ที่ Google Apps Script เหมือนเดิมทุกอย่าง
      หน้านี้แค่ทำหน้าที่เป็น "เปลือก" ห่อไว้เพื่อให้มี manifest/ไอคอนที่ browser มองเห็นได้จริง
      ถ้า URL ของ Apps Script เปลี่ยน (เช่น สร้าง deployment ใหม่แทนการ Edit ของเดิม) ต้องมาแก้ src ตรงนี้ด้วย
    -->
    <iframe src="https://script.google.com/macros/s/AKfycbzcYu8paQG_zFGH0sxgtmo3Z90PE4NN6l0eUdiNFZMxBiGeo5Aq4-8r2GSawxtUouJ2/exec" title="POS ก๋วยเตี๋ยวหมูต้มยำ"></iframe>
</body>
</html>
